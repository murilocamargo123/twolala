<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.jpg" type="image/x-icon">
    
   

    <title>Login - Twolala Hub</title>
</head>
<body>

    <div class="container">
      
        <img src="img/logo.jpg" alt="Logo Twolala Hub" class="logo-img">

        <h1>Fazer Login</h1>

        <form action="inicio.html" method="POST" class="login-form">
            
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" minlength="8" maxlength="16" required>
            </div>

            <button type="submit">Entrar</button>

        </form>

    </div>

</body>
</html>
